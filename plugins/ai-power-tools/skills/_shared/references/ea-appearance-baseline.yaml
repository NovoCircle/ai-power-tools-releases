# The EA appearance baseline.
#
# Enterprise Architect keeps some of its drawing preferences per user and per machine, outside the model.
# Two people open the same diagram and see it drawn differently when these differ: shadows, rounded corners,
# gradient fills, default colors, the default font, the theme. This file says what a site wants them to be.
# `get_ea_preferences` reads what a machine has, and the skills compare the two and report the drift.
#
# THIS FILE IS A STARTING POINT, AND PART OF IT IS UNFILLED ON PURPOSE.
#
#   * The names below are the preference names EA keeps. They were read from one machine; nothing else
#     about them has been confirmed.
#   * `appears_to_set` is a reading of the name, not a fact. A preference is marked `mapped: true` only
#     after a live run toggled the setting in EA's own dialog and saw this value change.
#   * `default` is EA's own default for the installed version. It is left empty (`null`) until that live
#     run fills it. An empty `default` is marked TO FILL below. It is not a claim that the default is empty.
#   * `expected` is yours. Set it to the value your site wants. Leave it `null` to say "no opinion".
#
# HOW THE COMPARISON READS THIS FILE, per preference:
#   1. `expected` is set       -> the machine must match `expected`.
#   2. else `default` is set   -> the machine must match EA's default.
#   3. else                    -> nothing to compare. The report lists the preference as "no baseline value".
#
# A value EA has not written (the preference was never changed on that machine) is EA's default. The report
# says "not set on this machine" and compares the default, where one is known.
#
# Setting a preference stays with the person, in EA's own Preferences dialog. Nothing reads or writes the
# registry for you except `get_ea_preferences`, which reads.

schema: 1

# The EA build the `default` values were mapped on. TO FILL by the live mapping run.
ea_version: "17.1 build 1716"   # the version the mapped entries were read on
status: unmapped            # becomes `mapped` when the live run has filled every `default` it can

